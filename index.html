<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一碰知鲜</title>
<meta name="description" content="婴幼儿配方奶粉智能包装：碰一碰查看信息、记录开罐、到期提醒。">
<meta name="theme-color" content="#16324F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一碰知鲜">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app" id="app">

  <!-- 平板 / 横屏：左侧导航栏 -->
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="rail-brand" title="一碰知鲜"><span class="mark"></span></div>
    <button class="rail-btn scan-rail" data-tab="scan">
      <span class="ic">◎</span><em>碰一碰</em>
    </button>
    <div class="rail-sep"></div>
    <button class="rail-btn" data-tab="home"><span class="ic">◍</span><em>状态</em></button>
    <button class="rail-btn" data-tab="recipe"><span class="ic">☰</span><em>冲调</em></button>
    <button class="rail-btn" data-tab="records"><span class="ic">▤</span><em>记录</em></button>
    <button class="rail-btn" data-tab="family"><span class="ic">◔</span><em>家人</em></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="railTheme"><span class="ic">◐</span><em>主题</em></button>
  </aside>

  <!-- 顶栏 -->
  <header class="appbar">
    <div class="ab-left">
      <span class="mark tiny"></span>
      <div class="ab-text">
        <b>一碰知鲜</b>
        <i id="barHint">待开罐</i>
      </div>
    </div>
    <div class="ab-right">
      <span class="chip" id="entryChip">NFC</span>
      <button class="icon-btn" id="btnDemo" aria-label="演示工具">⋯</button>
    </div>
  </header>

  <!-- 内容 -->
  <main class="main" id="main">
    <div class="main-inner" id="view"></div>
  </main>

  <!-- 手机：底部导航（中间为「碰一碰」主行动） -->
  <nav class="tabbar" aria-label="主导航">
    <button class="tab-btn" data-tab="home"><span class="ic">◍</span><em>状态</em></button>
    <button class="tab-btn" data-tab="recipe"><span class="ic">☰</span><em>冲调</em></button>
    <button class="tab-btn mid" data-tab="scan" aria-label="碰一碰">
      <span class="fab">◎</span><em>碰一碰</em>
    </button>
    <button class="tab-btn" data-tab="records"><span class="ic">▤</span><em>记录</em></button>
    <button class="tab-btn" data-tab="family"><span class="ic">◔</span><em>家人</em></button>
  </nav>
</div>

<!-- 摄像头扫码 -->
<div class="scanner" id="scanner">
  <video id="scanVideo" playsinline autoplay muted></video>
  <div class="scan-mask"><div class="scan-frame"><i></i></div></div>
  <div class="scan-hint" id="scanHint">把罐身二维码放入框内</div>
  <div class="scan-bar">
    <button class="btn ghost" id="scanTorch">开手电筒</button>
    <button class="btn" id="scanClose">关闭</button>
  </div>
</div>

<!-- 通用弹窗（重复识别警告等） -->
<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-ico" id="modalIco">!</div>
    <h3 id="modalTitle">标题</h3>
    <p id="modalBody">内容</p>
    <div class="modal-acts" id="modalActs"></div>
  </div>
</div>

<!-- 使用引导 -->
<div class="guide" id="guide">
  <div class="guide-top">
    <span class="guide-brand"><span class="mark tiny"></span>一碰知鲜</span>
    <button class="guide-skip" id="guideSkip">跳过</button>
  </div>
  <div class="guide-viewport" id="guideViewport">
    <div class="guide-track" id="guideTrack"></div>
  </div>
  <div class="guide-bottom">
    <div class="guide-dots" id="guideDots"></div>
    <div class="guide-acts" id="guideActs">
      <button class="btn ghost" id="guidePrev">上一步</button>
      <button class="btn" id="guideNext">下一步</button>
    </div>
  </div>
</div>

<!-- 界面操作导览（聚光灯） -->
<div class="tour" id="tour">
  <div class="tour-hole" id="tourHole"></div>
  <div class="tour-tip" id="tourTip">
    <div class="tour-step" id="tourStep">1 / 5</div>
    <h4 id="tourTitle"></h4>
    <p id="tourBody"></p>
    <div class="tour-acts">
      <button class="tour-link" id="tourSkip">跳过</button>
      <span class="spacer"></span>
      <button class="tour-btn ghost" id="tourPrev">上一步</button>
      <button class="tour-btn" id="tourNext">下一步</button>
    </div>
  </div>
</div>

<!-- 演示工具面板 -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-scrim" id="sheetScrim"></div>
  <section class="sheet" role="dialog" aria-label="演示工具">
    <div class="sheet-grip"></div>
    <h3>演示工具</h3>
    <p class="sheet-note">正式发布版会隐藏这一面板。开罐时间与提醒设置会保存在本机。</p>
    <div class="sheet-grid">
      <button class="btn ghost" data-jump="1">+1 天</button>
      <button class="btn ghost" data-jump="7">+7 天</button>
      <button class="btn ghost" data-jump="to21">跳到 D21</button>
      <button class="btn ghost" data-jump="to28">跳到 D28</button>
      <button class="btn ghost" data-jump="resetday">当天</button>
      <button class="btn ghost" id="btnPush">模拟到期推送</button>
      <button class="btn ghost" id="btnReopen">模拟重复识别</button>
      <button class="btn ghost" id="btnExpire">模拟过期自动归档</button>
      <button class="btn ghost" id="btnReset">重置为未开罐</button>
      <button class="btn ghost" id="btnWipe">清除本机数据</button>
      <button class="btn ghost" id="btnGuide">使用引导</button>
      <button class="btn ghost" id="btnTour">界面导览</button>
    </div>
    <div class="sheet-device" id="deviceInfo"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="nfsplash" id="splash"><span class="mark big"></span></div>

<script src="app.js"></script>
</body>
</html>
